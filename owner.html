<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owner Management</title>
    <link rel="stylesheet" href="owner.css">
    <link rel="stylesheet" href="alert.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script> <!-- ✅ Added -->
</head>
<body>

    <div class="admin-container">
        <div class="sidebar">
            <h2 class="sidebar-title">Admin Panel</h2>
            <nav>
                <a href="admin.html"> Dashboard Overview</a>
                <a href="rider.html">Manage Riders</a> 
                <a href="manager.html">Manage Managers</a>
                <a href="owner.html" class="active">Manage owner</a>
                <a href="customer.html">Manage Customers</a>
                <a href="#" class="logout-btn">Logout</a>
            </nav>
        </div>

        <div class="main-content">
            <h1 class="page-title">Owner Management</h1>
            
            <button class="btn-add-owner" onclick="openownerModal()">Add Owner</button>

            <div class="owner-table-container">
                <div class="table-header">
                    <span>Name</span>
                    <span>Email</span>
                    <span>Password</span>
                    <span>Phone no</span>
                    <span style="text-align: center;">Actions</span>
                </div>
                <div id="owner-list"> 
                    <p style="padding: 20px; text-align: center;">Loading owners...</p>
                </div>
            </div>
        </div>
    </div> 

    <div id="ownerModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">Add Owner</div>
            <form id="ownerForm">
                <div class="input-group">
                    <label>Name:</label>
                    <input type="text" id="ownerName" required placeholder="Enter name">
                </div>
                <div class="input-group">
                    <label>Email:</label>
                    <input type="email" id="ownerEmail" required placeholder="Enter email">
                </div>
                <div class="input-group">
    <label>Password:</label>
    <div style="position:relative;">
        <input type="password" id="ownerPassword" required placeholder="Enter password" style="width:100%; padding:10px; padding-right:40px; border:1px solid #ccc; border-radius:8px; box-sizing:border-box;">
        <i class="fa-regular fa-eye" onclick="togglePass('ownerPassword', this)" style="position:absolute; right:12px; top:50%; transform:translateY(-50%); cursor:pointer; color:#888;"></i>
    </div>
</div>
                <div class="input-group">
                    <label>Phone no:</label>
                   <input type="text" id="ownerPhone" required placeholder="03XXXXXXXXX" maxlength="11">
                </div>
                <div class="modal-actions">
                    <button type="submit" id="ownerRegBtn" class="btn-save">Register Owner</button> <!-- ✅ id added -->
                    <button type="button" class="btn-cancel" onclick="closeownerModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>
     <script src="alert.js"></script>
    <script src="owner.js"></script>
    <script src="admin logout.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special Offers Management</title>
    <link rel="stylesheet" href="alert.css">
    <link rel="stylesheet" href="special deal.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
</head>
<body>
    <div class="admin-container">
        <div class="sidebar">
            <h2 class="sidebar-title">Manager Panel</h2>
            <nav>
                <a href="dashboard.html">Dashboard</a>
                <a href="menu.html">Menu</a>
                <a href="orders.html">Orders</a>
                <a href="special-deal.html" class="active">Special Offers</a>
                <a href="manage-rider.html">Riders</a>
                <a href="review.html">Reviews</a>
                <a href="#" class="logout-btn">Logout</a>
            </nav>
        </div>

        <div class="main-content">
            <h1 class="page-title">Create Special Offer</h1>
            
            <div class="deal-layout">
                <form id="dealForm" class="deal-form">

                    <div class="input-group">
                        <label>Event Name:</label>
                        <input type="text" id="eventName" placeholder="e.g., Eid Special, Independence Day" required>
                    </div>

                    <div class="input-group">
                        <label>Deal Name:</label>
                        <input type="text" id="dealName" placeholder="e.g., Eid Family Deal" required>
                    </div>

                    <div class="input-group">
                        <label>Deal Price (Rs):</label>
                        <input type="number" id="dealPrice" placeholder="e.g., 1200" required>
                    </div>

                    <!-- 🟢 Start Date & End Date side by side -->
                    <div style="display:flex; gap:15px;">
                        <div class="input-group" style="flex:1;">
                            <label>Start Date:</label>
                            <input type="date" id="startDate" required>
                        </div>
                        <div class="input-group" style="flex:1;">
                            <label>End Date:</label>
                            <input type="date" id="endDate" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label>Items Detail:</label>
                        <textarea id="dealDesc" rows="5" placeholder="Items will auto-fill when you tick below..." required></textarea>
                    </div>

                    <button type="submit" class="btn-create-deal">Create & Save Offer</button>
                </form>

                <div class="menu-selection-box">
                    <h3>Select Items for this Offer</h3>
                    
                    <div class="category-tabs-container">
                        <button class="cat-tab" onclick="filterDealMenu('PIZZA')">PIZZA</button>
                        <button class="cat-tab" onclick="filterDealMenu('BURGER')">BURGER</button>
                        <button class="cat-tab" onclick="filterDealMenu('WINGS')">WINGS</button>
                        <button class="cat-tab" onclick="filterDealMenu('SOFT DRINK')">SOFT DRINK</button>
                        <button class="cat-tab" onclick="filterDealMenu('Sandwiches & Pasta')">Sandwiches & Pasta</button>
                        <button class="cat-tab" onclick="filterDealMenu('PARATHA ROLL')">PARATHA ROLL</button>
                        <button class="cat-tab" onclick="filterDealMenu('FRIES')">FRIES</button>
                    </div>

                    <p class="helper-text">Tick items to add in this offer:</p>
                    
                    <div id="menu-items-list" class="menu-items-grid-container">
                        <p style="text-align:center; padding:20px;">Loading menu items...</p>
                    </div>
                </div>
            </div>

            <div class="created-deals-section">
                <h2>All Active Special Offers</h2>
                <div class="deals-table-container">
                    <div class="deals-header">
                        <span>Event & Deal Name</span>
                        <span>Price (Rs)</span>
                        <span>Items</span>
                        <span style="text-align:center;">Actions</span>
                    </div>
                    <div id="active-deals-list"></div>
                </div>
            </div>
        </div>
    </div>

    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="alert.js"></script>
    <script src="special deal.js"></script>
    
<script src="manager logout.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deals Management</title>
    <link rel="stylesheet" href="deals.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
</head>
<body>
    <div class="admin-container">
        <div class="sidebar">
            <h2 class="sidebar-title">Manager Panel</h2>
            <nav>
                <a href="dashboard.html">Dashboard</a>
                <a href="menu.html">Menu</a>
                <a href="orders.html">Orders</a>
                <a href="deals.html" class="active">Deals</a>
                <a href="notification.html">Notification</a>
                <a href="logout.html">Logout</a>
            </nav>
        </div>

        <div class="main-content">
            <h1 class="page-title">Create New Deal / Combo</h1>
            
            <div class="deal-layout">
                <form id="dealForm" class="deal-form">
                    
                    <div class="input-group">
                        <label for="dealCategory">Package Type:</label>
                        <select id="dealCategory" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; background-color: #fff; font-size: 14px; font-weight: 500;" required>
                            <option value="DEALS">DEALS (Special / Event Specific)</option>
                            <option value="COMBO">COMBO (All-Time Regular Combo)</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label>Deal / Combo Name:</label>
                        <input type="text" id="dealName" placeholder="e.g., Special Pizza Deal" required>
                    </div>
                    <div class="input-group">
                        <label>Deal Price (Rs):</label>
                        <input type="number" id="dealPrice" placeholder="e.g., 1200" required>
                    </div>
                    <div class="input-group">
                        <label>Items Detail:</label>
                        <textarea id="dealDesc" rows="5" required></textarea>
                    </div>

                    <button type="submit" class="btn-create-deal">Create & Save Package</button>
                </form>

                <div class="menu-selection-box">
                    <h3>Select Items & Sizes for this Deal</h3>
                    
                    <div class="category-tabs-container">
                        <button class="cat-tab" onclick="filterDealMenu('PIZZA')">PIZZA</button>
                        <button class="cat-tab" onclick="filterDealMenu('BURGER')">BURGER</button>
                        <button class="cat-tab" onclick="filterDealMenu('WINGS')">WINGS</button>
                        <button class="cat-tab" onclick="filterDealMenu('SOFT DRINK')">SOFT DRINK</button>
                        <button class="cat-tab" onclick="filterDealMenu('Sandwiches & Pasta')">Sandwiches & Pasta</button>
                        <button class="cat-tab" onclick="filterDealMenu('PARATHA ROLL')">PARATHA ROLL</button>
                        <button class="cat-tab" onclick="filterDealMenu('FRIES')">FRIES</button>
                    </div>

                    <p class="helper-text">Tick the specific size of items to add in deal:</p>
                    
                    <div id="menu-items-list" class="menu-items-grid-container">
                        <p style="text-align: center; padding: 20px;">Loading menu items...</p>
                    </div>
                </div>
            </div>

            <div class="created-deals-section">
                <h2>All Active Deals & Combos</h2>
                <div class="deals-table-container">
                    <div class="deals-header">
                        <span>Deal Name</span>
                        <span>Price (Rs)</span>
                        <span>Included Items & Sizes</span>
                        <span style="text-align: center;">Actions</span>
                    </div>
                    <div id="active-deals-list">
                        </div>
                </div>
            </div>

        </div>
    </div>

    <script src="deals.js"></script>
</body>
</html>

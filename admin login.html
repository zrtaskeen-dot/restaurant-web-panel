<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link rel="stylesheet" href="admin login.css">
</head>
<body>

    <div class="page-wrapper">

        <!-- LEFT SIDE: Dark Panel -->
        <div class="left-panel">
           <div class="brand-side">
    <div class="logo-wrapper">
        <img src="image/logo.jpg" alt="Kentucky Restaurant Logo" class="brand-logo-img">
    </div>
    <h2>Kentucky<br>Restaurant</h2>
</div>
</div>
        <!-- RIGHT SIDE: Login Form -->
        <div class="right-panel">
            <div class="form-box">

                <div class="form-header">
                    <h2>Welcome Back</h2>
                    <p>Sign in to your admin account</p>
                </div>

                <form id="adminLoginForm">

                    <div class="field">
                        <label for="adminEmail">Email Address</label>
                        <input 
                            type="email" 
                            id="adminEmail" 
                            placeholder="admin@example.com"
                            required
                            autocomplete="off"
                        />
                    </div>

                    <div class="field">
                        <label for="adminPassword">Password</label>
                        <div class="pass-wrap">
                            <input 
                                type="password" 
                                id="adminPassword" 
                                placeholder="Enter your password"
                                required
                            />
                            <button type="button" id="eyeBtn" class="eye-btn">
                                <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <!-- ✅ Forgot Password Link -->
                    <div class="forgot-link">
                        <a href="#" id="forgotPasswordLink">Forgot Password?</a>
                    </div>

                    <button type="submit" id="btnAdminLogin" class="btn-login">
                        Login
                    </button>

                </form>

                <div id="adminToast" class="toast hidden"></div>

            </div>
        </div>

    </div>

    <!-- ✅ Forgot Password Modal -->
    <div id="forgotModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:9999; align-items:center; justify-content:center;">
        <div style="background:#fff; border-radius:16px; padding:36px 32px; width:100%; max-width:400px; box-shadow:0 10px 40px rgba(0,0,0,0.2); position:relative; margin: 0 16px;">
            <h3 style="margin:0 0 6px; font-size:20px; color:#1a1a1a;">Reset Password</h3>
            <p style="margin:0 0 24px; font-size:13px; color:#666;">Enter your registered admin email. We will send you a password reset link.</p>

            <div class="field">
                <label for="forgotEmail">Email Address</label>
                <input type="email" id="forgotEmail" placeholder="admin@example.com" autocomplete="off"
                    style="width:100%; padding:12px 16px; border:1.5px solid #ddd; border-radius:10px; font-size:14px; outline:none; box-sizing:border-box;"/>
            </div>

            <button id="sendResetBtn" style="width:100%; padding:13px; background:#b52a00; color:white; border:none; border-radius:10px; font-size:15px; font-weight:600; cursor:pointer; margin-top:16px;">
                Send Reset Link
            </button>
            <button onclick="closeForgotModal()" style="width:100%; padding:11px; background:transparent; color:#888; border:1.5px solid #ddd; border-radius:10px; font-size:14px; cursor:pointer; margin-top:10px;">
                Cancel
            </button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="admin login.js"></script>

</body>
</html>
